<script>
const data=JSON.parse(document.getElementById('catalog').textContent),days=data.days.map(x=>x.date);
const date=document.getElementById('date'),search=document.getElementById('search'),category=document.getElementById('category'),root=document.getElementById('offers'),count=document.getElementById('count'),more=document.getElementById('more'),picks=document.getElementById('picks');
date.add(new Option('全部历史','all'));for(const day of data.days)date.add(new Option(day.date+' · '+day.count+' 条',day.date));
const params=new URLSearchParams(location.search),requested=params.get('date');date.value=requested==='all'||days.includes(requested)?requested:(days[0]||'all');search.value=params.get('q')||'';
let matches=[],shown=0;const pageSize=60;
function text(p,t,v,c){const n=document.createElement(t);n.textContent=v;if(c)n.className=c;p.append(n);return n}
function missing(o,k){return o[k]||'报道未说明'}
function offerCard(o){const card=document.createElement('article');card.className='card';const main=document.createElement('div');const badges=text(main,'div','','badges');text(badges,'span',o.snapshot_date||o.date||'历史线索','badge');text(badges,'span',o.company||o.platform||'平台未注明','badge');text(badges,'span',o.verify_status||'公开报道线索','badge verify');text(main,'h3',o.title);const src=text(main,'div','','source');src.append(document.createTextNode((o.source_name||o.publisher||'来源未注明')+' · '+(o.published_at||o.published||'发布日期未注明')+'　'));const a=document.createElement('a');a.href=o.source_url||o.link||'#';a.target='_blank';a.rel='noopener noreferrer';a.textContent='查看来源';src.append(a);const details=document.createElement('div');details.className='details';const amount=o.deal_amount;text(details,'div',amount||'优惠力度未注明',amount?'amount':'amount unknown');text(details,'div','门槛：'+missing(o,'threshold'));const exp=o.valid_until;if(!exp)text(details,'div','有效期未注明','expiry');else{const remaining=Math.ceil((new Date(exp+'T23:59:59+08:00')-new Date())/86400000);text(details,'div',remaining<=3?'即将截止':'长期有效','expiry '+(remaining<=3?'soon':'long'))}text(details,'div','地区：'+missing(o,'region'));text(details,'div','领取：'+missing(o,'entry'));text(details,'div','使用：'+missing(o,'how_to_use'));card.append(main,details);return card}
function draw(){const part=matches.slice(shown,shown+pageSize),groups=new Map();for(const o of part){const k=o.scene||o.category||'其他线索';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o)}for(const [name,items] of groups){const section=document.createElement('section');section.className='group';text(section,'h2',name+'　'+items.length+' 条');for(const o of items)section.append(offerCard(o));root.append(section)}shown+=part.length;more.hidden=shown>=matches.length}
function update(){const selected=date.value,q=search.value.trim().toLocaleLowerCase();matches=data.offers.filter(x=>(selected==='all'||(x.snapshot_date||x.date)===selected)&&(!category.value||(x.scene||x.category)===category.value)&&(!q||[x.company,x.platform,x.title,x.publisher,x.source_name,x.scene,x.category].filter(Boolean).join(' ').toLocaleLowerCase().includes(q)));root.replaceChildren();shown=0;count.textContent=(selected==='all'?'全部 '+days.length+' 天':'采集于 '+selected)+' · 找到 '+matches.length+' 条线索';if(matches.length)draw();else text(root,'div','当前没有符合条件的线索。试试切换日期或场景。','empty');const noted=matches.filter(x=>x.deal_amount||/(满\s*\d+\s*减\s*\d+|(?:至高|最高)?\s*(?:补贴|立减|优惠)\s*\d+(?:\.\d+)?\s*(?:元|%)|\d+(?:\.\d+)?\s*折)/.test(x.title||'')).slice(0,5);picks.replaceChildren();if(noted.length){for(const o of noted){const a=document.createElement('a');a.className='pick';a.href=o.source_url||o.link||'#';a.target='_blank';a.rel='noopener noreferrer';text(a,'strong',o.deal_amount||'查看报道中的力度');text(a,'span',(o.company||o.platform)+' · '+o.title);picks.append(a)}}else text(picks,'div','这一天没有标题明确写出优惠数字的线索。','source');const i=days.indexOf(selected);document.getElementById('older').disabled=i<0||i>=days.length-1;document.getElementById('newer').disabled=i<=0;const url=new URL(location.href);url.searchParams.set('date',selected);q?url.searchParams.set('q',search.value.trim()):url.searchParams.delete('q');history.replaceState(null,'',url)}
date.addEventListener('change',update);search.addEventListener('input',update);category.addEventListener('change',update);more.addEventListener('click',draw);document.getElementById('older').addEventListener('click',()=>{date.value=days[days.indexOf(date.value)+1];update()});document.getElementById('newer').addEventListener('click',()=>{date.value=days[days.indexOf(date.value)-1];update()});update();
</script></body></html>
